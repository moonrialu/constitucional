# Build do site no Netlify: Flutter Web.
# O site é publicado a partir de build/web, gerado por tool/netlify_build.sh.

[build]
  command = "bash tool/netlify_build.sh"
  publish = "build/web"

[build.environment]
  FLUTTER_VERSION = "3.47.8"

# O projeto não tem package.json; evita o Netlify tentar instalar Node.
[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# O app é uma SPA: HTML, bootstrap e service worker nunca devem vir do cache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
